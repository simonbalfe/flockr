<style>
/* Layout: a quiet three-pane Mac app. Sidebar, conversation, inspector. One accent, used only for what you can act on. */
:root {
  --bg: #ffffff; --side: #fafafa; --fill: #f4f4f5; --fill2: #e4e4e7; --sep: #e4e4e7; --sel: #f4f4f5;

  --l1: #fafafa; --l2: #a1a1aa; --l3: #71717a; --accent: #fafafa; --on-accent: #18181b;
  --green: #fafafa; --red: #f87171; --orange: #a1a1aa; --blue: #a1a1aa; --gray: #71717a;
  --seg: #27272a; --shadow: none; --hud: #fafafa; --hud-fg: #18181b; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #09090b; --side: #0c0c0e; --fill: #18181b; --fill2: #27272a; --sep: #27272a; --sel: #18181b;
  --l1: #fafafa; --l2: #a1a1aa; --l3: #71717a; --accent: #fafafa; --on-accent: #18181b;
  --green: #fafafa; --red: #f87171; --orange: #a1a1aa; --blue: #a1a1aa; --gray: #71717a;

}
[hidden] { display: none !important; }
html, body { height: 100%; }

.app { display: grid; grid-template-columns: 232px minmax(0, 1fr) auto; height: 100%; }

/* Sidebar */

.row { display: flex; align-items: center; gap: 9px; width: 100%; height: 28px; padding: 0 8px; border-radius: 6px; text-align: left; font-size: 13.5px; }

.pdot.working { background: var(--l1); } .pdot.blocked { background: var(--red); } .pdot.idle { background: var(--l3); }

/* Avatars */
.av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; flex: none;
  background: var(--fill2); color: var(--l1); }
.av.sq { border-radius: 8px; }

.event { text-align: center; color: var(--l2); font-size: 12.5px; padding: 8px 0; }

/* Lists: inset grouped rows */
.list { margin-top: 6px; background: var(--fill); border-radius: 10px; overflow: hidden; max-width: 640px; }
.trow, .kvr { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px; text-align: left; }
.trow:hover { background: var(--fill2); }

.kvr + .kvr::before { left: 12px; }
.sd { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--gray); flex: none; }
.sd.waiting { border-color: var(--l3); border-style: dashed; }

.ask .q { font-weight: 600; }

.btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.pbtn { background: var(--accent); color: var(--on-accent); }

.sbtn, .dbtn { background: var(--fill2); }
.ask .sbtn, .ask .dbtn { background: var(--bg); }

.dbtn { color: var(--red); }
.lbtn { color: var(--accent); font-size: 13px; padding: 5px 4px; }

.thr { display: inline-flex; align-items: center; gap: 8px; margin: 4px 0 0 -6px; padding: 3px 10px 3px 6px; border-radius: 8px; font-size: 12.5px; color: var(--l2); border: 1px solid transparent; }
.thr:hover { background: var(--fill); border-color: var(--sep); }

.thr.add svg { width: 13px; height: 13px; }
.msg:hover .thr.add, .thr.add:focus-visible { opacity: 1; }

/* Composer */
.composer { padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) 24px; max-width: 904px; flex: none; }
.field { display: flex; align-items: flex-end; gap: 8px; background: var(--fill); border-radius: 10px; padding: 5px 5px 5px 14px; border: 1px solid var(--sep); background: var(--bg); }

.pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--l1); animation: pulse 1.8s ease-in-out infinite; }

/* Tasks and inbox */
.cols { display: grid; grid-template-columns: repeat(6, minmax(176px, 1fr)); gap: 12px; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px 24px; overflow-x: auto; align-items: stretch; min-height: 100%; }
.lane { background: var(--side); border: 1px solid var(--sep); border-radius: 10px; padding: 10px 8px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.colh { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 500; padding: 0 4px; color: var(--l2); }
.colh .c { color: var(--l3); font-weight: 400; margin-left: auto; font-variant-numeric: tabular-nums; }
.cards { display: grid; gap: 8px; align-content: start; }
.card { display: grid; gap: 8px; text-align: left; width: 100%; background: var(--bg); border: 1px solid var(--sep); border-radius: 8px; padding: 10px 11px; box-shadow: var(--shadow); }
.card:hover { border-color: var(--l3); }
.card .ch { display: flex; align-items: center; gap: 8px; }

.card .cf { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
.card .cw { display: inline-flex; align-items: center; gap: 6px; color: var(--l2); font-size: 12.5px; min-width: 0; }

.none { color: var(--l3); font-size: 13px; padding: 8px 4px; }
.inbox { padding: 12px max(16px, env(safe-area-inset-right, 0px)) 24px 24px; max-width: 720px; }

.thread { width: 380px; border-left: 1px solid var(--sep); background: var(--bg); display: flex; flex-direction: column; min-height: 0; padding-right: env(safe-area-inset-right, 0px); }

.thread .sh { padding: 0 20px; }

/* Spotlight and HUD */
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .16); display: grid; place-items: start center; padding: 14vh max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); z-index: 30; }
.pal { width: min(600px, 100%); background: color-mix(in srgb, var(--bg) 86%, transparent); -webkit-backdrop-filter: blur(28px) saturate(1.6); backdrop-filter: blur(28px) saturate(1.6); border-radius: 14px; box-shadow: 0 24px 70px rgba(0, 0, 0, .3), 0 0 0 .5px var(--sep); overflow: hidden; }

@media (max-width: 1100px) { .thread { position: fixed; top: 0; right: 0; bottom: 0; width: min(380px, 100%); z-index: 20; box-shadow: -12px 0 40px rgba(0, 0, 0, .18); padding-top: env(safe-area-inset-top, 0px); } }

<script>

      <div class="phead">${av(a, "lg")}<div><h2>${a}</h2><div class="stline"><span class="pdot ${st.s}" style="position:static;border:0"></span>${st.s === "working" ? "Working on #" + st.id : st.s === "blocked" ? "Blocked on #" + st.id : "Idle"}</div></div></div>
      <div class="list kv"><div class="kvr"><span>Runs in</span><span>${esc(m.where)}</span></div><div class="kvr"><span>Acts for</span><span>${m.owner}</span></div></div>
      <div class="sh" style="padding:0;margin:6px 0 -6px">Tasks</div><div class="list">${mine.map(([id]) => taskRow(id, true)).join("") || '<div class="none" style="padding:9px 12px">No tasks yet.</div>'}</div>
    </div></div>`;
    return;
  }
  if (/^m\d+$/.test(S.panel)) {
    const th = S.panel, { m, ch } = findRoot(th), rs = R[th];
    el.innerHTML = `${head(`<span class="sub" style="color:var(--l1);font-weight:600">Thread</span><span class="sub">#${ch}</span>`)}
      <div class="tbody"><div class="feed" style="padding-top:16px">${groupHtml({ who: m.who, t: m.t, items: [{ ...m, th: null }] }, true)}
        <div class="sh" style="padding:0;margin:6px 0 4px">${rs.length} ${rs.length === 1 ? "reply" : "replies"}</div>
        ${rs.length ? feedHtml(rs, true) : '<div class="none">No replies yet.</div>'}
        <div class="btns" style="margin-top:12px"><button class="sbtn" data-act="mktask" data-id="${th}">Make this a task</button></div></div></div>
      <div class="composer"><div class="field"><textarea id="rinput" rows="1" placeholder="Reply" aria-label="Reply"></textarea><button class="send" data-act="rsend" data-id="${th}" aria-label="Send">${I.up}</button></div></div>`;
    return;
  }
  const id = S.panel, t = T[id], [st, cls] = stateText(t);
  const rows = [];
  if (t.holder) rows.push(["Holder", `${av(t.holder, "xs")}${t.holder}`]);
  else if (t.assignee) rows.push(["For", `${av(t.assignee, "xs")}${t.assignee}`]);
  if (t.needs.length) rows.push(["Needs", t.needs.map((n) => `${dot(T[n].state)}<button class="tlink" data-act="open" data-id="${n}">#${n}</button>`).join(" ")]);
  if (t.reason) rows.push(["Reason", `<span style="color:var(--red)">${esc(t.reason)}</span>`]);
  if (t.spec) rows.push(["Spec", `<span class="mono">${t.spec}</span>`]);
  if (t.commit) rows.push(["Commit", `<span class="mono">${t.commit}</span>`]);
  rows.push(["Kind", t.kind]);
  el.innerHTML = `${head(`<span class="tid">#${id}</span><span class="sub">#${t.ch}</span>`)}
    <div class="tbody"><div class="insp"><h2>${esc(t.title)}</h2>
      <div class="stline">${dot(t.state)}<span>${LABEL[t.state]}</span>${t.state === "claimed" || t.state === "waiting" || t.state === "ready" ? `<span>·</span><span class="${cls}">${esc(st)}</span>` : ""}</div>
      <div class="list kv">${rows.map(([k, v]) => `<div class="kvr"><span>${k}</span><span>${v}</span></div>`).join("")}</div>
      ${t.ask && t.state === "claimed" ? askCard(id) : ""}
      <div class="btns">${actionsFor(id)}</div></div>
      <div class="sh">Replies</div>
      <div class="feed">${R[id].length ? feedHtml(R[id], true) : '<div class="none">No replies yet.</div>'}</div></div>
    <div class="composer"><div class="field"><textarea id="rinput" rows="1" placeholder="Reply" aria-label="Reply"></textarea><button class="send" data-act="rsend" data-id="${id}" aria-label="Send">${I.up}</button></div></div>`;
}
function renderPresence() {
  const working = ["claude", "codex", "gemini"].map((a) => [a, agentStatus(a)]).filter(([, s]) => s.s === "working");
  $("#presence").innerHTML = working.map(([a, s]) => { const t = T[s.id], l = leaseLeft(t);
    return `<button class="pres" data-act="open" data-id="${s.id}"><span class="pulse"></span><b>${a}</b> #${s.id} <span class="${l <= 3 ? "low" : ""}">${l} min</span></button>`; }).join("");
  $("#input").placeholder = `Message #${S.ch}`;
}
function render() {
  const keep = $("#rinput") ? $("#rinput").value : null;
  renderSide(); renderTop();
  if (S.view === "messages") renderMessages(); else if (S.view === "tasks") renderTasks(); else renderInbox();
  renderPanel(); renderPresence();
  if (keep !== null && $("#rinput")) $("#rinput").value = keep;
}

/* Actions */
function send() {
  const el = $("#input"), text = el.value.trim(); if (!text) return; el.value = ""; autosize(el);
  const ch = S.view === "inbox" || S.scope === "all" ? S.ch : S.ch;
  if (S.view !== "messages") { S.view = "messages"; S.scope = "channel"; }
  post(ch, { who: "simon", text });
  createFromMention(text, ch);
}
function openTask(id) { S.panel = String(id); S.blocking = false; render(); const b = $("#thread .tbody"); if (b) b.scrollTop = b.scrollHeight; }
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]"); if (!b) { if (!e.target.closest("#side") && $("#side").classList.contains("open") && !e.target.closest(".menu")) $("#side").classList.remove("open"); return; }
  const a = b.dataset.act, id = b.dataset.id;
  const closeSide = () => $("#side").classList.remove("open");
  switch (a) {
    case "channel": S.ch = id; S.view = "messages"; S.scope = "channel"; S.unread[id] = 0; closeSide(); render(); scrollEnd(); break;
    case "view": S.view = id; S.scope = "channel"; render(); if (id === "messages") scrollEnd(); break;
    case "alltasks": S.view = "tasks"; S.scope = "all"; closeSide(); render(); break;
    case "inbox": S.view = "inbox"; closeSide(); render(); break;
    case "agent": S.panel = "agent:" + id; closeSide(); render(); break;
    case "open": openTask(id); break;
    case "thread": S.panel = id; S.blocking = false; render(); { const b2 = $("#thread .tbody"); if (b2) b2.scrollTop = b2.scrollHeight; const ri = $("#rinput"); if (ri) ri.focus(); } break;
    case "mktask": { const { m, ch } = findRoot(id); const nid = Math.max(...Object.keys(T).map(Number)) + 2;
      const title = m.text.replace(/`/g, "").replace(/@\w+/g, "").trim().replace(/[.?]$/, ""); T[nid] = { title: title.length > 60 ? title.slice(0, 57) + "..." : title, ch, kind: "build", state: "ready", needs: [], assignee: null }; R[nid] = R[id].slice();
      post(ch, { kind: "task", task: nid, who: "simon" }); toast(`Made #${nid} from the thread`); openTask(nid); break; }
    case "close": S.panel = null; render(); break;
    case "send": send(); break;
    case "rsend": { const el = $("#rinput"), text = el.value.trim(); if (!text) return; el.value = ""; reply(id, { who: "simon", text });
      const m = text.match(/@(claude|codex|gemini)\b/); if (m) setTimeout(() => reply(id, { who: m[1], text: "Got it, picking that up in this thread." }), 1200); break; }
    case "yes": answer(id, true); toast("Answered"); break;
    case "no": answer(id, false); toast("Answered"); break;
    case "claimme": claim(id, "simon"); toast(`You claimed #${id}`); break;
    case "give": T[id].assignee = "claude"; claim(id, "claude"); break;
    case "done": setState(id, "done", "simon", "completed this task"); post(T[id].ch, { kind: "event", who: "simon", text: `completed #${id}` }); toast(`Completed #${id}`); break;
    case "release": { const t = T[id]; t.state = "ready"; reply(id, { kind: "event", who: t.holder, text: "released this task" }); t.holder = null; delete t.lease; render(); toast(`Released #${id}`); break; }
    case "block": S.blocking = id; render(); $("#reason") && $("#reason").focus(); break;
    case "unblock": { const t = T[id]; t.state = t.holder ? "claimed" : "ready"; if (t.holder) t.lease = Date.now() + 15 * min; delete t.reason; reply(id, { kind: "event", who: "simon", text: "unblocked this task" }); if (t.holder && M[t.holder].type === "agent" && t.kind === "prod-change") work(id, t.holder); toast(`Unblocked #${id}`); break; }
    case "approve": setState(id, "done", "simon", "approved and completed this task"); post(T[id].ch, { kind: "event", who: "simon", text: `approved #${id}` }); toast(`Approved #${id}`); break;
    case "changes": { const t = T[id]; t.state = "claimed"; t.lease = Date.now() + 15 * min; reply(id, { who: "simon", text: "A couple of changes, see the thread." }); render(); if (t.holder && M[t.holder].type === "agent") work(id, t.holder); toast(`Sent #${id} back to ${t.holder}`); break; }
    case "palette": openPalette(); break;
    case "menu": $("#side").classList.toggle("open"); break;
    case "pick": closePalette(); pickResult(b.dataset.kind, id); break;
  }
});
document.addEventListener("submit", (e) => {
  const f = e.target.closest(".blockform"); if (!f) return; e.preventDefault();
  const id = f.dataset.id, t = T[id], reason = ($("#reason").value || "").trim() || "Blocked by simon";
  S.blocking = false; t.state = "blocked"; t.reason = reason; delete t.lease;
  reply(id, { kind: "event", who: "simon", text: `blocked this task: ${reason}` }); post(t.ch, { kind: "event", who: "simon", text: `blocked #${id}: ${reason}` }); toast(`Blocked #${id}`);
});
function autosize(el) { el.style.height = "auto"; el.style.height = Math.min(el.scrollHeight, 140) + "px"; }
document.addEventListener("input", (e) => { if (e.target.tagName === "TEXTAREA") autosize(e.target); if (e.target.id === "pq") listPalette(); });
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("#palette").hidden ? openPalette() : closePalette(); return; }
  if (e.key === "Escape") { if (!$("#palette").hidden) closePalette(); else if (S.blocking) { S.blocking = false; render(); } else if (S.panel) { S.panel = null; render(); } return; }
  if (e.key === "Enter" && !e.shiftKey && e.target.id === "input") { e.preventDefault(); send(); }
  if (e.key === "Enter" && !e.shiftKey && e.target.id === "rinput") { e.preventDefault(); document.querySelector('[data-act="rsend"]').click(); }
  if (e.target.id === "pq" && e.key === "Enter") { e.preventDefault(); const f = $("#pl button"); if (f) f.click(); }
});

/* Palette */
function openPalette() { $("#palette").hidden = false; $("#pq").value = ""; listPalette(); $("#pq").focus(); }
function closePalette() { $("#palette").hidden = true; }
$("#palette").addEventListener("click", (e) => { if (e.target.id === "palette") closePalette(); });
function listPalette() {
  const q = $("#pq").value.toLowerCase().replace(/^#/, "");
  const rows = [
    ...CH.map((c) => ({ k: "channel", id: c.id, html: `<span class="tid">#</span><span>${c.id}</span>` })),
    ...Object.entries(T).map(([id, t]) => ({ k: "task", id, text: `${id} ${t.title}`, html: `${dot(t.state)}<span class="tid">${id}</span><span>${esc(t.title)}</span>` })),
    ...["claude", "codex", "gemini"].map((a) => ({ k: "agent", id: a, html: `${av(a, "xs")}<span>${a}</span>` })),
  ].filter((r) => !q || (r.text || r.id).toLowerCase().includes(q)).slice(0, 9);
  $("#pl").innerHTML = rows.map((r, i) => `<li><button class="${i === 0 ? "sel" : ""}" data-act="pick" data-kind="${r.k}" data-id="${r.id}">${r.html}<span class="pt">${r.k}</span></button></li>`).join("") || '<li class="none" style="padding:10px">No results</li>';
}
function pickResult(kind, id) {
  if (kind === "channel") { S.ch = id; S.view = "messages"; S.scope = "channel"; S.unread[id] = 0; render(); scrollEnd(); }
  else if (kind === "task") { const t = T[id]; S.ch = t.ch; S.view = "messages"; S.scope = "channel"; openTask(id); }
  else { S.panel = "agent:" + id; render(); }
}

setInterval(() => { Object.entries(T).forEach(([id, t]) => { if (t.state === "claimed" && t.lease && t.lease < Date.now() && !t.ask) { t.state = "ready"; post(t.ch, { kind: "event", who: t.holder, text: `lease ran out on #${id}, back to ready` }); t.holder = null; delete t.lease; } }); render(); }, 20000);
render(); scrollEnd();
</script>
