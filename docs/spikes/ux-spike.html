<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flockr UX spike</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono&display=swap">
<style>
:root {
  --bg: #ffffff; --side: #fafafa; --fill: #f4f4f5; --fill2: #e4e4e7; --sep: #e4e4e7; --sel: #ececee;
  --l1: #09090b; --l2: #71717a; --l3: #a1a1aa;
  --accent: #18181b; --on-accent: #fafafa; --red: #dc2626;
  --seg: #ffffff; --shadow: 0 1px 2px rgba(0, 0, 0, .06); --shadow-m: 0 8px 28px rgba(0, 0, 0, .12); --shadow-l: 0 24px 70px rgba(0, 0, 0, .28);
  --hud: #18181b; --hud-fg: #fafafa; --hl: #e4e4e7;
  --sans: "Geist", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --mono: "Geist Mono", "SF Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #09090b; --side: #0c0c0e; --fill: #18181b; --fill2: #27272a; --sep: #27272a; --sel: #1f1f23;
  --l1: #fafafa; --l2: #a1a1aa; --l3: #71717a; --accent: #fafafa; --on-accent: #18181b; --red: #f87171;
  --seg: #27272a; --shadow: none; --shadow-m: 0 8px 28px rgba(0, 0, 0, .5); --shadow-l: 0 24px 70px rgba(0, 0, 0, .6);
  --hud: #fafafa; --hud-fg: #18181b; --hl: #2c2c31; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #09090b; --side: #0c0c0e; --fill: #18181b; --fill2: #27272a; --sep: #27272a; --sel: #1f1f23;
  --l1: #fafafa; --l2: #a1a1aa; --l3: #71717a; --accent: #fafafa; --on-accent: #18181b; --red: #f87171;
  --seg: #27272a; --shadow: none; --shadow-m: 0 8px 28px rgba(0, 0, 0, .5); --shadow-l: 0 24px 70px rgba(0, 0, 0, .6);
  --hud: #fafafa; --hud-fg: #18181b; --hl: #2c2c31; color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--l1); font: 14px/1.5 var(--sans); letter-spacing: -.003em; -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
code { font: 12.5px var(--mono); background: var(--fill); border-radius: 4px; padding: 1px 5px; }
.app { display: grid; grid-template-columns: 256px minmax(0, 1fr) auto; height: 100%; }

.side { background: var(--side); border-right: 1px solid var(--sep); display: flex; flex-direction: column; min-height: 0; padding-left: env(safe-area-inset-left, 0px); }
.ws { display: flex; align-items: center; gap: 2px; height: 52px; padding: 0 10px 0 18px; flex: none; }
.ws .name { font-weight: 600; font-size: 15px; flex: 1; }
.iconbtn { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 7px; color: var(--l2); flex: none; }
.iconbtn:hover { background: var(--fill2); color: var(--l1); }
.iconbtn.on { background: var(--fill2); color: var(--l1); }
.side nav { flex: 1; overflow-y: auto; padding: 2px 10px 16px; display: grid; gap: 18px; align-content: start; }
.gh { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--l3); padding: 0 4px 4px 8px; height: 24px; }
.gh .iconbtn { width: 22px; height: 22px; opacity: 0; }
.gh .iconbtn svg { width: 14px; height: 14px; }
nav > div:hover .gh .iconbtn, .gh .iconbtn:focus-visible { opacity: 1; }
.row { display: flex; align-items: center; gap: 9px; width: 100%; height: 30px; padding: 0 8px; border-radius: 6px; text-align: left; font-size: 13.5px; color: var(--l1); }
.row:hover { background: var(--fill2); }
.row.on { background: var(--sel); font-weight: 500; }
.row .ic { color: var(--l2); display: grid; place-items: center; width: 18px; }
.row .hash { color: var(--l3); width: 18px; text-align: center; font-weight: 500; }
.row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.unread .name { font-weight: 600; }
.row .meta { font-size: 12px; color: var(--l3); font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 8px; }
.row .meta span { display: inline-flex; align-items: center; gap: 3px; }
.row .meta svg { width: 12px; height: 12px; }
.badge { min-width: 18px; height: 18px; padding: 0 6px; border-radius: 9px; background: var(--accent); color: var(--on-accent); font-size: 11px; font-weight: 600; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
.avw { position: relative; display: inline-grid; flex: none; }
.pdot { position: absolute; right: -3px; bottom: -3px; width: 6px; height: 6px; border-radius: 50%; border: 2px solid var(--side); box-sizing: content-box; }
.pdot.working { background: var(--l1); }
.pdot.idle { background: var(--side); box-shadow: inset 0 0 0 1.5px var(--l3); }
.pdot.blocked { background: var(--red); }
.pdot.inline { position: static; border: 0; display: inline-block; }
.av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; flex: none; background: var(--fill2); color: var(--l1); }
.av.sq { border-radius: 8px; }
.av.xs { width: 20px; height: 20px; font-size: 10px; }
.av.xs.sq { border-radius: 6px; }
.av.lg { width: 44px; height: 44px; font-size: 17px; }
.av.lg.sq { border-radius: 12px; }
.av.xl { width: 64px; height: 64px; font-size: 24px; }
.av.xl.sq { border-radius: 16px; }
.guide { margin: 0 10px 8px; padding: 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--sep); display: grid; gap: 8px; flex: none; }
.guide .gt { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--l2); font-weight: 500; }
.guide .gx { font-size: 13px; line-height: 1.4; text-wrap: pretty; }
.guide .dots { display: flex; gap: 4px; }
.guide .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--fill2); }
.guide .dots i.done { background: var(--l1); }
.guide .dots i.now { box-shadow: inset 0 0 0 1.5px var(--l1); background: none; }
.acct { border-top: 1px solid var(--sep); padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px)); flex: none; }
.acct .row { height: 36px; }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.top { display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 16px 0 24px; border-bottom: 1px solid var(--sep); flex: none; }
.top .menu { display: none; }
.ttl { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
.ttl .h { font-size: 15px; font-weight: 600; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; }
.ttl .h .hash { color: var(--l3); font-weight: 500; margin-right: -6px; }
.ttl .topic { color: var(--l2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chinfo { display: inline-flex; align-items: center; gap: 10px; height: 30px; padding: 0 6px 0 8px; border-radius: 8px; color: var(--l2); font-size: 12.5px; flex: none; }
.chinfo:hover, .chinfo.on { background: var(--fill); }
.fbadge { display: inline-flex; align-items: center; gap: 5px; font: 12px var(--mono); color: var(--l2); white-space: nowrap; }
.fbadge svg { width: 13px; height: 13px; }
.stack { display: inline-flex; }
.stack .av { box-shadow: 0 0 0 2px var(--bg); }
.stack .av + .av { margin-left: -5px; }
.seg { display: inline-flex; background: var(--fill); border-radius: 8px; padding: 2px; flex: none; }
.seg button { padding: 3px 12px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--l2); }
.seg button.on { background: var(--seg); color: var(--l1); box-shadow: var(--shadow); }
.seg .n { color: var(--l3); margin-left: 4px; font-variant-numeric: tabular-nums; }
.body { flex: 1; overflow-y: auto; min-height: 0; }

.feed { padding: 12px 24px 8px; max-width: 820px; }
.day { text-align: center; color: var(--l3); font-size: 12px; font-weight: 600; margin: 8px 0 10px; }
.msg { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; padding: 8px 10px; margin: 0 -10px; border-radius: 10px; }
.main .msg:hover { background: var(--side); }
.mbody { min-width: 0; }
.meta { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
.who { font-weight: 600; font-size: 13.5px; }
.sub { color: var(--l2); font-size: 12.5px; }
.time { color: var(--l3); font-size: 12px; font-variant-numeric: tabular-nums; }
.tag { font-size: 11px; font-weight: 600; color: var(--l2); background: var(--fill); border-radius: 5px; padding: 1px 6px; }
.text { margin: 2px 0 0; overflow-wrap: anywhere; text-wrap: pretty; }
.text + .text { margin-top: 6px; }
.mention { font-weight: 500; background: var(--fill); border-radius: 4px; padding: 0 3px; }
.tlink { color: var(--l1); font-weight: 500; text-decoration: underline; text-decoration-color: var(--l3); text-underline-offset: 3px; font-variant-numeric: tabular-nums; }
.tlink:hover { text-decoration-color: var(--l1); }
.caret { display: inline-block; width: 7px; height: 14px; background: var(--l1); vertical-align: -2px; margin-left: 2px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.event { text-align: center; color: var(--l2); font-size: 12.5px; padding: 8px 0; }
.event b { color: var(--l1); font-weight: 500; }
.notice { display: flex; gap: 10px; align-items: flex-start; margin: 4px 0 8px 42px; padding: 10px 12px; border-radius: 10px; background: var(--fill); max-width: 620px; }
.notice .nt { flex: 1; min-width: 0; }
.notice .nq { font-weight: 500; }
.notice .nd { color: var(--l2); font-size: 12.5px; margin: 1px 0 8px; }
.notice.done { background: none; padding: 0; color: var(--l2); font-size: 12.5px; }
.notice svg { color: var(--l2); margin-top: 2px; }
.thr { display: inline-flex; align-items: center; gap: 8px; margin: 6px 0 0 -6px; padding: 3px 10px 3px 6px; border-radius: 8px; font-size: 12.5px; color: var(--l2); border: 1px solid transparent; max-width: 100%; }
.thr:hover { background: var(--bg); border-color: var(--sep); }
.thr b { color: var(--l1); font-weight: 600; white-space: nowrap; }
.thr .live { display: inline-flex; align-items: center; gap: 6px; color: var(--l1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thr.add { opacity: 0; color: var(--l3); }
.thr.add svg { width: 13px; height: 13px; }
.msg:hover .thr.add, .thr.add:focus-visible { opacity: 1; }
.pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--l1); animation: pulse 1.6s ease-in-out infinite; flex: none; }
@keyframes pulse { 50% { opacity: .25; } }
.intro { text-align: center; padding: 40px 16px 24px; display: grid; justify-items: center; gap: 6px; }
.intro h2 { margin: 10px 0 0; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
.intro p { margin: 0; color: var(--l2); max-width: 420px; text-wrap: pretty; }
.codebox { text-align: left; margin-top: 12px; width: min(460px, 100%); }
.codebox .cl { font-size: 12px; color: var(--l2); margin-bottom: 4px; }
.codebox pre { margin: 0; padding: 10px 12px; background: var(--fill); border-radius: 8px; font: 12.5px var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }

.list { margin-top: 6px; background: var(--fill); border-radius: 10px; overflow: hidden; max-width: 620px; }
.trow { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px; text-align: left; min-height: 40px; }
.trow:hover { background: var(--fill2); }
.trow + .trow::before { content: ""; position: absolute; top: 0; left: 34px; right: 0; height: 1px; background: var(--sep); }
.sd { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--l3); flex: none; }
.sd.waiting { border-color: var(--l3); border-style: dashed; }
.sd.ready { border-color: var(--l1); }
.sd.claimed { border-color: var(--l1); background: conic-gradient(var(--l1) 0 50%, transparent 0); }
.sd.blocked { border-color: var(--red); background: var(--red); }
.sd.review { border-color: var(--l1); background: var(--bg); box-shadow: inset 0 0 0 2px var(--bg), inset 0 0 0 6px var(--l1); }
.sd.done { border-color: var(--l3); background: var(--l3); }
.tid { font: 12px var(--mono); color: var(--l3); min-width: 24px; }
.tt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; font-weight: 500; }
.chn { color: var(--l3); font-size: 12.5px; font-weight: 400; }
.st { color: var(--l2); font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.st.low { color: var(--red); }

.ask { margin-top: 8px; background: var(--fill); border-radius: 12px; padding: 13px 14px 12px; max-width: 620px; }
.ask .q { font-weight: 600; display: flex; align-items: center; gap: 8px; }
.ask .q svg { color: var(--l2); }
.ask .d { color: var(--l2); font-size: 13px; margin: 3px 0 12px; text-wrap: pretty; }
.ask .cmd { margin: 8px 0 6px; padding: 9px 12px; background: var(--bg); border-radius: 8px; font: 12.5px var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pbtn, .sbtn, .dbtn, .obtn { border-radius: 7px; padding: 5px 14px; font-size: 13px; font-weight: 500; min-height: 30px; white-space: nowrap; }
.pbtn { background: var(--accent); color: var(--on-accent); }
.pbtn:hover { filter: brightness(1.15); }
.pbtn:disabled { opacity: .4; cursor: default; filter: none; }
.sbtn { background: var(--fill2); }
.ask .sbtn { background: var(--bg); box-shadow: var(--shadow), 0 0 0 1px var(--sep); }
.sbtn:hover { background: var(--sel); }
.ask .sbtn:hover { background: var(--side); }
.obtn { box-shadow: 0 0 0 1px var(--sep); }
.obtn:hover { background: var(--fill); }
.dbtn { color: var(--red); background: var(--fill2); }
.lbtn { color: var(--l1); font-size: 13px; padding: 5px 4px; font-weight: 500; text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 3px; }
.lbtn:hover { text-decoration-color: var(--l3); }
.dline { display: flex; align-items: center; gap: 8px; margin-top: 6px; color: var(--l2); font-size: 12.5px; flex-wrap: wrap; }
.dline svg { width: 14px; height: 14px; }

.run { margin-top: 8px; border: 1px solid var(--sep); border-radius: 10px; background: var(--bg); max-width: 640px; overflow: hidden; }
.runh { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 12px; text-align: left; font-size: 13px; color: var(--l2); min-height: 38px; }
.runh:hover { background: var(--side); }
.runh .rt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--l1); }
.runh .rt b { font-weight: 600; }
.runh .rm { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--l3); font-size: 12.5px; }
.chev { transition: transform .15s ease; color: var(--l3); width: 14px; height: 14px; }
.open > .runh .chev, .open > .sl .chev { transform: rotate(90deg); }
.steps { border-top: 1px solid var(--sep); padding: 6px 0 8px; }
.sl { display: flex; align-items: center; gap: 9px; width: 100%; padding: 4px 12px; text-align: left; font-size: 13px; min-height: 30px; color: var(--l1); }
button.sl:hover { background: var(--side); }
.sl .ti { color: var(--l3); }
.sl .tl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sl .tl code { font-size: 12px; padding: 0 4px; }
.sl .ts { color: var(--l3); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.sbody { padding: 4px 12px 8px 35px; display: grid; gap: 8px; min-width: 0; }
.sbody > .ask { margin: 0; }
.reason { margin: 0; color: var(--l2); font-size: 13px; text-wrap: pretty; }
.shimmer { background: linear-gradient(90deg, var(--l3) 0%, var(--l3) 35%, var(--l1) 50%, var(--l3) 65%, var(--l3) 100%); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shim 1.8s linear infinite; }
@keyframes shim { from { background-position: 100% 0; } to { background-position: -150% 0; } }
.ss { width: 14px; height: 14px; border-radius: 50%; flex: none; display: grid; place-items: center; }
.ss svg { width: 10px; height: 10px; stroke-width: 2.4; }
.ss.run { border: 1.5px solid var(--fill2); border-top-color: var(--l1); animation: spin .8s linear infinite; }
.ss.done { background: var(--l1); color: var(--bg); }
.ss.fail { border: 1.5px solid var(--l1); color: var(--l1); }
.ss.wait { border: 1.5px solid var(--l1); }
.ss.wait::after { content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--l1); animation: pulse 1.6s ease-in-out infinite; }
.ss.skip { border: 1.5px dashed var(--l3); }
.ss.stop { border: 1.5px solid var(--l3); }
.ss.stop::after { content: ""; width: 5px; height: 5px; background: var(--l3); border-radius: 1px; }
@keyframes spin { to { transform: rotate(360deg); } }
.plan { margin: 2px 12px 6px; padding: 8px 10px; border-radius: 8px; background: var(--side); }
.planh { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 500; color: var(--l2); margin-bottom: 4px; }
.planh .c { margin-left: auto; color: var(--l3); font-weight: 400; font-variant-numeric: tabular-nums; }
.plan ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.plan li { display: flex; align-items: center; gap: 8px; font-size: 13px; min-height: 24px; }
.plan li.todo { color: var(--l2); }
.plan li.done { color: var(--l2); text-decoration: line-through; text-decoration-color: var(--l3); }
.plan li.doing { font-weight: 500; }
.pc { width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid var(--l3); flex: none; display: grid; place-items: center; }
.plan li.doing .pc { border-color: var(--l1); }
.plan li.doing .pc::after { content: ""; width: 4px; height: 4px; background: var(--l1); border-radius: 1px; }
.plan li.done .pc { background: var(--l1); border-color: var(--l1); color: var(--bg); }
.pc svg { width: 9px; height: 9px; stroke-width: 2.6; }
.diff, .term, .tests, .ftree { border: 1px solid var(--sep); border-radius: 8px; overflow: hidden; min-width: 0; }
.dh { display: flex; justify-content: space-between; gap: 8px; padding: 5px 10px; background: var(--side); border-bottom: 1px solid var(--sep); font: 12px var(--mono); color: var(--l2); }
.dscroll { overflow-x: auto; }
.dl { display: grid; grid-template-columns: 34px 14px auto; font: 12px/1.65 var(--mono); white-space: pre; min-width: max-content; }
.dl .n { color: var(--l3); text-align: right; padding-right: 8px; user-select: none; }
.dl .m { color: var(--l3); user-select: none; }
.dl.add { background: var(--fill); }
.dl.add .m { color: var(--l1); }
.dl.del { color: var(--l3); }
.dl.del .c { text-decoration: line-through; }
.dl .c { padding-right: 12px; }
.term { background: var(--fill); border: 0; }
.term .dh { background: none; border-color: var(--fill2); }
.term pre { margin: 0; padding: 8px 10px; font: 12px/1.6 var(--mono); overflow-x: auto; max-height: 200px; color: var(--l2); }
.term pre b { color: var(--l1); font-weight: 500; }
.tests .tsh { display: flex; gap: 10px; align-items: center; padding: 7px 10px; font-size: 12.5px; background: var(--side); border-bottom: 1px solid var(--sep); }
.tests .tsh b { font-weight: 600; }
.tests .tsh .time { margin-left: auto; }
.tests ul { list-style: none; margin: 0; padding: 4px 0; }
.tests li { display: flex; align-items: center; gap: 8px; padding: 3px 10px; font-size: 12.5px; }
.tests li .time { margin-left: auto; }
.tests li.bad { font-weight: 500; }
.trace { border-top: 1px solid var(--sep); padding: 8px 10px; font: 12px/1.6 var(--mono); }
.trace .tre { color: var(--l1); font-weight: 500; white-space: pre-wrap; }
.trace .fr { color: var(--l2); white-space: pre; overflow-x: auto; }
.trace .fr u { text-decoration-color: var(--l3); text-underline-offset: 3px; color: var(--l1); }
.ftree { padding: 6px 0; }
.fr2 { display: flex; align-items: center; gap: 7px; padding: 2px 10px; font: 12px/1.7 var(--mono); }
.fr2 svg { width: 13px; height: 13px; color: var(--l3); }
.fr2 .fs { margin-left: auto; color: var(--l3); font-variant-numeric: tabular-nums; }

function openMkTask(th) {
  const root = findItem(th), cid = S.thm[th].ch;
  const title = root.text.replace(/@[\w-]+\s*/g, "").replace(/^(can we get|can you|could we|please)\s+/i, "").replace(/[?.]$/, "");
  modal(`<h3>Make this a task</h3>
    <div class="fld"><label for="f-title">Title</label><input class="in" id="f-title" value="${esc(title.charAt(0).toUpperCase() + title.slice(1))}"></div>
    <div class="fld"><span class="lb">Assignee</span>${assigneeOpts(cid, "")}</div>
    <label class="chk" id="bindrow" hidden><input type="checkbox" id="f-bind" checked><div><span id="bindlbl">Bind to codex</span><div>It reads this thread, works in it and replies here.</div></div></label>
    <div class="dfoot"><button class="sbtn" data-act="modal-close">Cancel</button><button class="pbtn" data-act="mktask-go" data-id="${th}">Make task</button></div>`);
}
function openNewTask(cid) {
  const chId = cid || (S.view.kind === "channel" ? S.view.id : "backend");
  const demo = chId === "backend" && !S.flags.declined && ch("backend").members.includes("claude");
  modal(`<h3>New task in #${chId}</h3>
    <div class="fld"><label for="f-title">Title</label><input class="in" id="f-title" value="${demo ? "Rotate the staging database password" : ""}" placeholder="What needs an owner"></div>
    <div class="fld"><span class="lb">Assignee</span>${assigneeOpts(chId, demo ? "claude" : "")}</div>
    <div id="f-err" class="err" hidden></div>
    <div class="dfoot"><button class="sbtn" data-act="modal-close">Cancel</button><button class="pbtn" data-act="newtask-go" data-id="${chId}">Create task</button></div>`);
}
function openNewAgent() {
  modal(`<h3>New agent</h3>
    <div class="fld"><label for="f-name">Name</label><input class="in" id="f-name" placeholder="scout" autocomplete="off"></div>
    <div class="fld"><span class="lb">Harness</span><div class="opts">${Object.entries(HARNESSES).map(([k, h], i) => `<label class="opt"><input type="radio" name="har" value="${k}"${i === 0 ? " checked" : ""}><span class="on1">${esc(h.label)}<div>${esc(h.hint)}</div></span></label>`).join("")}</div></div>
    <div class="fld"><label for="f-folder">Folder</label><input class="in mono" id="f-folder" value="acme"></div>
    <div id="f-err" class="err" hidden></div>
    <div class="dfoot"><button class="sbtn" data-act="modal-close">Cancel</button><button class="pbtn" data-act="newagent-go">Create and open chat</button></div>`);
}
function openNewChannel() {
  modal(`<h3>New channel</h3>
    <div class="fld"><label for="f-name">Name</label><input class="in" id="f-name" placeholder="billing" autocomplete="off"></div>
    <div class="fld"><label for="f-topic">Topic</label><input class="in" id="f-topic" placeholder="Invoices and plans"></div>
    <div class="fld"><label for="f-folder">Folder</label><input class="in mono" id="f-folder" value="acme"></div>
    <div id="f-err" class="err" hidden></div>
    <div class="dfoot"><button class="sbtn" data-act="modal-close">Cancel</button><button class="pbtn" data-act="newchannel-go">Create channel</button></div>`);
}
function openNewDM() {
  modal(`<h3>New message</h3><div class="opts">${[...Object.keys(S.people).filter((p) => p !== "simon"), ...Object.keys(S.agents)].map((m) => `<button class="opt" data-act="dm" data-id="${m}">${avd(m, "xs")}<span class="on1" style="text-align:left">${m}${isAgent(m) ? `<div>${ag(m).owner === "simon" ? "your agent" : ag(m).owner + "'s agent"} · ${esc(ag(m).where)}</div>` : ""}</span></button>`).join("")}</div><div class="dfoot"><button class="sbtn" data-act="newagent">New agent</button><button class="sbtn" data-act="modal-close">Close</button></div>`);
}
function openAddMember(cid) {
  const c = ch(cid), others = allIds().filter((m) => !c.members.includes(m));
  modal(`<h3>Add to #${cid}</h3>${others.length ? `<div class="opts">${others.map((m) => `<div class="opt">${avd(m, "xs")}<span class="on1">${m}${isAgent(m) ? `<div>${ag(m).owner === "simon" ? "your agent" : ag(m).owner + "'s agent"} · ${esc(ag(m).where)}</div>` : ""}</span><button class="sbtn" data-act="addmember-go" data-id="${cid}" data-m="${m}">Add</button></div>`).join("")}</div>` : `<div class="none">Everyone is already in #${cid}.</div>`}<div class="dfoot"><button class="sbtn" data-act="modal-close">Done</button></div>`);
}
function addMember(cid, m) {
  const c = ch(cid); if (c.members.includes(m)) return;
  c.members.push(m);
  postChannel(cid, { kind: "event", text: `simon added ${m} to #${cid}` });
  if (isAgent(m)) mark(m, "channels");
  toast(`Added ${m} to #${cid}`);
}
function pickChannelForAdd() { const cid = S.view.kind === "channel" ? S.view.id : "platform"; openAddMember(cid); }

function popAt(btn, html, below) {
  const p = $("#pop"); p.innerHTML = html; p.hidden = false;
  const r = btn.getBoundingClientRect(), w = p.offsetWidth, h = p.offsetHeight;
  let x = Math.min(r.left, window.innerWidth - w - 8), y = below ? r.bottom + 6 : r.top - h - 6;
  if (y < 8) y = r.bottom + 6; if (y + h > window.innerHeight - 8) y = window.innerHeight - h - 8;
  p.style.left = Math.max(8, x) + "px"; p.style.top = y + "px";
}
function closePop() { $("#pop").hidden = true; }
function themeName() { return document.documentElement.dataset.theme || "system"; }

let PAL = [], palSel = 0;
function openPalette() { closePop(); $("#palette").hidden = false; $("#pq").value = ""; palSel = 0; listPalette(); $("#pq").focus(); }
function closePalette() { $("#palette").hidden = true; }
function listPalette() {
  const q = $("#pq").value.toLowerCase().replace(/^[#@]/, "").trim();
  const items = [
    ...S.order.map((c) => ({ g: "Channels", label: c, html: `<span class="ic">${I.hash}</span><span>${c}</span>`, k: "channel", run: () => go({ kind: "channel", id: c, tab: "messages" }) })),
    ...S.contacts.map((m) => ({ g: "Direct messages", label: m, html: `${avd(m, "xs")}<span>${m}</span>`, k: isAgent(m) ? "agent" : "person", run: () => go({ kind: "dm", id: m }) })),
    ...Object.keys(S.agents).map((a) => ({ g: "Agents", label: a + " profile", html: `${av(a, "xs")}<span>${a}</span><span class="sub">profile</span>`, k: "profile", run: () => openAgent(a) })),
    ...Object.values(S.tasks).map((t) => ({ g: "Tasks", label: `${t.id} ${t.title}`, html: `<span class="sd ${t.state}"></span><span class="tid">#${t.id}</span><span>${esc(t.title)}</span>`, k: "task", run: () => openTask(t.id) })),
    { g: "Actions", label: "New agent", html: `<span class="ic">${I.bot}</span><span>New agent</span>`, k: "action", run: openNewAgent },
    { g: "Actions", label: "Add agent to channel", html: `<span class="ic">${I.plus}</span><span>Add agent to channel</span>`, k: "action", run: pickChannelForAdd },
    { g: "Actions", label: "New task", html: `<span class="ic">${I.task}</span><span>New task</span>`, k: "action", run: () => openNewTask(null) },
    { g: "Actions", label: "New channel", html: `<span class="ic">${I.hash}</span><span>New channel</span>`, k: "action", run: openNewChannel },
    { g: "Actions", label: "Waiting for you", html: `<span class="ic">${I.inbox}</span><span>Waiting for you</span>`, k: "action", run: () => go({ kind: "inbox" }) },
    { g: "Actions", label: "All tasks", html: `<span class="ic">${I.list}</span><span>All tasks</span>`, k: "action", run: () => go({ kind: "tasks" }) },
    { g: "Actions", label: "Reset demo", html: `<span class="ic">${I.reset}</span><span>Reset demo</span>`, k: "action", run: resetDemo },
  ];
  PAL = items.filter((r) => !q || r.label.toLowerCase().includes(q)).slice(0, q ? 12 : 40);
  palSel = Math.min(palSel, Math.max(0, PAL.length - 1));
  let lastG = "";
  $("#pl").innerHTML = PAL.map((r, i) => { const gh = r.g !== lastG ? `<li class="pg">${r.g}</li>` : ""; lastG = r.g; return `${gh}<li><button class="${i === palSel ? "sel" : ""}" data-act="pal" data-id="${i}">${r.html}</button></li>`; }).join("") || '<li class="none" style="padding:10px">No results</li>';
  const s = $("#pl .sel"); if (s) s.scrollIntoView({ block: "nearest" });
}

function resetDemo() { clearAll(); S.streams = []; closePop(); closeModal(); closePalette(); seed(); render(); toast("Demo reset"); }
function saveEdit() {
  const e = S.edit, el = $("#ed-in"); if (!e || !el) return;
  const v = el.value.trim();
  if (e.kind === "personality") { if (v) { ag(e.id).personality = v; mark(e.id, "personality"); push(conv("d:" + e.id), { kind: "event", text: `simon edited ${e.id}'s personality in its profile` }); } }
  else if (e.kind === "folder") { if (v) { ag(e.id).folder = v; mark(e.id, "folder"); push(conv("d:" + e.id), { kind: "event", text: `simon set ${e.id}'s folder to ${v}` }); } }
  else if (e.kind === "chfolder") { if (v) { ch(e.id).folder = v; postChannel(e.id, { kind: "event", text: `simon bound #${e.id} to the folder ${v}` }); } }
  else if (e.kind === "note") { const arr = noteArr(e.layer, e.owner); const n = arr.find((x) => x.id === e.id); if (n && v) n.text = v; }
  else if (e.kind === "add") { if (v) { noteArr(e.layer, e.owner).push({ id: uid("n"), text: v, by: "simon" }); if (e.layer === "agent") mark(e.owner, "memory"); if (e.layer === "yours" && S.panel && S.panel.kind === "agent") mark(S.panel.id, "yours"); } }
  S.edit = null; render();
}
function noteArr(layer, owner) { return layer === "agent" ? ag(owner).memory : layer === "channel" ? ch(owner).notes : S.yourNotes; }

document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]");
  if (!e.target.closest("#pop") && !(b && (b.dataset.act === "plus" || b.dataset.act === "acct"))) closePop();
  if (!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  switch (a) {
    case "channel": closeModal(); go({ kind: "channel", id, tab: "messages" }); break;
    case "dm": closeModal(); go({ kind: "dm", id }); break;
    case "inbox": go({ kind: "inbox" }, { panel: null }); break;
    case "alltasks": go({ kind: "tasks" }, { panel: null }); break;
    case "tab": S.view = { ...S.view, tab: id }; S.scrollEnd.main = true; render(); break;
    case "info": S.panel = S.panel && S.panel.kind === "info" ? null : { kind: "info", id }; S.edit = null; render(); break;
    case "agent": $("#toast").hidden = true; if (S.panel && S.panel.kind === "agent" && S.panel.id === id && b.classList.contains("iconbtn")) { S.panel = null; render(); } else openAgent(id); break;
    case "thread": $("#toast").hidden = true; openThread(id); break;
    case "task": openTask(id); break;
    case "close": S.panel = null; S.edit = null; render(); break;
    case "drawer": S.drawer = !S.drawer; render(); break;
    case "send": if (id === "ta-panel") sendPanel(); else sendMain(); break;
    case "chip": { if (id === "ta-main") { S.drafts[convKey()] = b.dataset.text; render(); sendMain(); } break; }
    case "stop": { const r = S.runs[id]; if (r) { stopRun(r); toast(`Stopped ${r.agent}`); } break; }
    case "seg": { const [rid, si] = id.split(":"); const s = S.runs[rid].segs[+si]; s.open = !s.open; render(); break; }
    case "step": { const [rid, k] = id.split(":"); const [si, j] = k.split(".").map(Number); const s = S.runs[rid].segs[si].steps[j]; s.open = !s.open; render(); break; }
    case "answer": answer(id, b.dataset.choice); break;
    case "notice-add": case "notice-no": {
      const list = [...Object.values(S.conv), ...Object.values(S.thr)].find((l) => l.some((x) => x.id === id));
      const n = list && list.find((x) => x.id === id); if (!n || n.status !== "open") break;
      if (a === "notice-add") { n.status = "added"; addMember(n.ch, n.agent); startAgent(n.agent, n.ch, n.root, n.text); }
      else n.status = "declined";
      render(); break;
    }
    case "mktask": openMkTask(id); break;
    case "mktask-go": {
      const th = id, title = $("#f-title").value.trim() || "Untitled task", asg = (document.querySelector('input[name="asg"]:checked') || {}).value || "";
      const bind = asg && isAgent(asg) && $("#f-bind").checked, cid = S.thm[th].ch;
      const tid = createTask({ title, ch: cid, assignee: asg || null, by: "simon", thread: th, bound: bind ? asg : null, state: "ready" });
      S.thm[th].task = tid;
      push(thr(th), { kind: "event", text: `simon made this thread task #${tid}${asg ? ` for ${asg}` : ""}${bind ? `, bound to ${asg}` : ""}` });
      if (bind && !S.thm[th].agents.includes(asg)) S.thm[th].agents.push(asg);
      S.flags.task = true;
      closeModal(); toast(`Made #${tid} from the thread`); render();
      if (asg && isAgent(asg)) later(() => {
        const t = S.tasks[tid]; t.state = "claimed"; t.holder = asg; t.lease = Date.now() + 15 * MIN;
        push(thr(th), { kind: "event", text: `${asg} claimed #${tid}` });
        if (bind) say(thr(th), asg, `Took #${tid}. I read the thread: CSV of users for the beta group, after the API ships. I will reuse the paging from \`GET /users\` once claude's change lands.`);
      }, 1500);
      break;
    }
    case "newtask": openNewTask(id || null); break;
    case "newtask-go": {
      const cid = id, title = $("#f-title").value.trim(), asg = (document.querySelector('input[name="asg"]:checked') || {}).value || "";
      if (!title) { const er = $("#f-err"); er.textContent = "Give the task a title."; er.hidden = false; break; }
      const m = rootMsg(cid, { who: "simon", text: `New task: ${title}` });
      const tid = createTask({ title, ch: cid, assignee: asg || null, by: "simon", thread: m.id, state: "ready" });
      m.task = tid;
      closeModal(); S.view = { kind: "channel", id: cid, tab: "tasks" }; render();
      if (asg && isAgent(asg)) {
        if (/password|secret|credential/i.test(title)) {
          S.flags.declined = true;
          later(() => { const t = S.tasks[tid]; const reason = `This needs the staging secrets, and ${asg} has no access to them. Someone with access should take it, or give ${asg} access first.`; t.assignee = null; t.declined = { by: asg, reason, short: "needs secrets it cannot read" };
            push(thr(m.id), { who: asg, text: `I am declining #${tid}. ${reason}` });
            postChannel(cid, { kind: "event", text: `${asg} declined #${tid}: needs secrets it cannot read` });
            toast(`${asg} declined #${tid}`, { act: "task", id: String(tid), label: "See why" }); }, 1800);
        } else later(() => { const t = S.tasks[tid]; t.state = "claimed"; t.holder = asg; t.lease = Date.now() + 15 * MIN; push(thr(m.id), { kind: "event", text: `${asg} claimed #${tid}` }); renderSoon(); }, 1500);
      }
      break;
    }
    case "claim": { const t = S.tasks[id]; t.state = "claimed"; t.holder = "simon"; t.lease = Date.now() + 15 * MIN; delete t.declined; toast(`You claimed #${id}`); render(); break; }
    case "done": { const t = S.tasks[id]; t.state = "done"; toast(`Completed #${id}`); render(); break; }
    case "release": { const t = S.tasks[id]; t.state = "ready"; t.holder = null; t.assignee = null; delete t.lease; render(); break; }
    case "newagent": closeModal(); openNewAgent(); break;
    case "newagent-go": {
      const name = $("#f-name").value.trim().toLowerCase(), har = document.querySelector('input[name="har"]:checked').value, folder = $("#f-folder").value.trim() || "acme";
      const er = $("#f-err");
      if (!/^[a-z][a-z0-9-]{1,19}$/.test(name)) { er.textContent = "Use 2 to 20 lowercase letters, numbers or dashes, starting with a letter."; er.hidden = false; break; }
      if (S.people[name] || S.agents[name]) { er.textContent = `${name} is taken. Pick another name.`; er.hidden = false; break; }
      const h = HARNESSES[har];
      S.agents[name] = { id: name, owner: "simon", harness: har, where: h.where("simon"), model: h.models[0], personality: "Helpful and plain-spoken.", memory: [], folder, perms: { edits: "free", commands: "ask" }, rules: [], connected: !h.connect };
      S.contacts.splice(Object.keys(S.agents).length - 1, 0, name);
      conv("d:" + name).push({ kind: "intro", agent: name }, { id: uid("i"), who: name, t: now(), text: h.connect ? "Connect me with the command above, then tell me what I am for." : `Hi simon. I am ${name}. Tell me what I am for, where to work and what to check with you first.` });
      S.drafts["d:" + name] = `Your job is reviewing pull requests in acme. Work in ${folder}. Ask me before you run commands. Remember this for future work.`;
      closeModal(); go({ kind: "dm", id: name });
      if (h.connect) later(() => { S.agents[name].connected = true; push(conv("d:" + name), { kind: "event", text: `${name} connected with the flockr CLI` }); }, 3500);
      break;
    }
    case "newchannel": openNewChannel(); break;
    case "newchannel-go": {
      const name = $("#f-name").value.trim().toLowerCase().replace(/^#/, ""), er = $("#f-err");
      if (!/^[a-z][a-z0-9-]{1,20}$/.test(name)) { er.textContent = "Use lowercase letters, numbers or dashes."; er.hidden = false; break; }
      if (S.channels[name]) { er.textContent = `#${name} exists already.`; er.hidden = false; break; }
      S.channels[name] = { id: name, topic: $("#f-topic").value.trim() || "No topic yet", folder: $("#f-folder").value.trim() || "acme", members: ["simon"], notes: [] };
      S.order.push(name);
      conv("c:" + name).push({ kind: "event", t: now(), text: `simon created #${name}` });
      closeModal(); go({ kind: "channel", id: name, tab: "messages" }); break;
    }
    case "newdm": openNewDM(); break;
    case "addmember": openAddMember(id); break;
    case "addmember-go": addMember(id, b.dataset.m); openAddMember(id); render(); break;
    case "modal-close": closeModal(); break;
    case "modal-bg": if (e.target === b) closeModal(); break;
    case "palette": openPalette(); break;
    case "pal": { const r = PAL[+id]; closePalette(); if (r) r.run(); break; }
    case "plus": popAt(b, `<button data-act="newchannel">${I.hash}New channel</button><button data-act="newdm">${I.chat}New message</button><button data-act="newagent">${I.bot}New agent</button>`, true); break;
    case "acct": popAt(b, `<div class="prow"><span>Theme</span><span class="segs">${["system", "light", "dark"].map((t) => `<button class="${themeName() === t ? "on" : ""}" data-act="theme" data-id="${t}">${t[0].toUpperCase() + t.slice(1)}</button>`).join("")}</span></div><hr><button class="small" data-act="reset">${I.reset}Reset demo</button>`, false); break;
    case "theme": if (id === "system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = id; b.parentElement.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b)); break;
    case "reset": resetDemo(); break;
    case "guide": runGuide(+id); break;
    case "perso-edit": S.edit = { kind: "personality", id }; render(); $("#ed-in") && $("#ed-in").focus(); break;
    case "folder-edit": S.edit = { kind: "folder", id }; render(); $("#ed-in") && $("#ed-in").focus(); break;
    case "chfolder-edit": S.edit = { kind: "chfolder", id }; render(); $("#ed-in") && $("#ed-in").focus(); break;
    case "note-edit": S.edit = { kind: "note", id, layer: b.dataset.kind, owner: b.dataset.owner }; render(); $("#ed-in") && $("#ed-in").focus(); break;
    case "note-add": S.edit = { kind: "add", layer: b.dataset.kind, owner: b.dataset.owner }; render(); $("#ed-in") && $("#ed-in").focus(); break;
    case "note-del": { const arr = noteArr(b.dataset.kind, b.dataset.owner); const i = arr.findIndex((x) => x.id === id); if (i >= 0) { const [n] = arr.splice(i, 1); toast(`Deleted: ${n.text}`); } render(); break; }
    case "ed-save": saveEdit(); break;
    case "ed-cancel": S.edit = null; render(); break;
    case "perm": { const x = ag(id); x.perms[b.dataset.k] = b.dataset.v; mark(id, "perms"); push(conv("d:" + id), { kind: "event", text: `simon set ${id} to ${b.dataset.v === "ask" ? "ask before" : "freely"} ${b.dataset.k === "edits" ? "editing files" : "running commands"}` }); render(); break; }
    case "rule-del": { const x = ag(id); x.rules = x.rules.filter((r) => r.id !== b.dataset.rule); mark(id, "perms"); render(); break; }
  }
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.act === "model") { ag(t.dataset.id).model = t.value; push(conv("d:" + t.dataset.id), { kind: "event", text: `simon switched ${t.dataset.id} to ${t.value}` }); render(); }
  if (t.name === "asg" && $("#bindrow")) { const v = t.value; $("#bindrow").hidden = !(v && isAgent(v)); $("#bindlbl").textContent = `Bind to ${v}`; }
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.tagName === "TEXTAREA" && t.dataset.key) { S.drafts[t.dataset.key] = t.value; autosize(t); }
  if (t.id === "pq") { palSel = 0; listPalette(); }
});
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("#palette").hidden ? openPalette() : closePalette(); return; }
  if (e.key === "Escape") {
    if (!$("#modal").hidden) closeModal();
    else if (!$("#palette").hidden) closePalette();
    else if (!$("#pop").hidden) closePop();
    else if (S.edit) { S.edit = null; render(); }
    else if (S.drawer) { S.drawer = false; render(); }
    else if (S.panel) { S.panel = null; render(); }
    return;
  }
  if (e.target.id === "pq") {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); palSel = (palSel + (e.key === "ArrowDown" ? 1 : -1) + PAL.length) % Math.max(1, PAL.length); listPalette(); }
    if (e.key === "Enter") { e.preventDefault(); const r = PAL[palSel]; closePalette(); if (r) r.run(); }
    return;
  }
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    if (e.target.id === "ta-main") { e.preventDefault(); sendMain(); }
    else if (e.target.id === "ta-panel") { e.preventDefault(); sendPanel(); }
    else if (e.target.id === "ed-in" && e.target.tagName === "INPUT") { e.preventDefault(); saveEdit(); }
    else if (e.target.closest && e.target.closest(".dialog") && e.target.tagName === "INPUT" && e.target.type !== "radio" && e.target.type !== "checkbox") { e.preventDefault(); const p = $(".dialog .dfoot .pbtn"); if (p) p.click(); }
  }
});
$("#palette").addEventListener("click", (e) => { if (e.target.id === "palette") closePalette(); });
window.addEventListener("resize", renderSoon);

seed(); render();
</script>
</body>
</html>
